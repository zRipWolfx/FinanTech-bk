spring.application.name=backend
server.port=8080

spring.devtools.livereload.enabled=true

# Hostinger remoto: SSL + timeouts; el servidor corta idle ~60s
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true\&allowPublicKeyRetrieval=true\&serverTimezone=UTC\&connectTimeout=15000\&socketTimeout=60000
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool chico + no retener idle (Hostinger cierra el socket)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=25000
spring.datasource.hikari.keepalive-time=10000

spring.jpa.hibernate.ddl-auto=update
# Hostinger suele ser MariaDB/MySQL viejo (falla metadata RESERVED)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Evita que el health check tire del pool cada ~30s con conexiones muertas
management.health.db.enabled=false

app.frontend-base-url=${FRONTEND_BASE_URL:https://finan.mtasoftware.cloud}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
